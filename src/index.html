<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Joey Millaire — Développeur Web Full-Stack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Joey Millaire, développeur web full-stack à Victoriaville (Québec). Formé en .NET, WordPress, Vue.js et Angular : sites modernes, performants et élégants.">
  <meta name="theme-color" content="#f4f3ee">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" as="image" href="images/joey.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Écran de chargement : affiché avant le démarrage d'Angular */
    #loader {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-items: center;
      background: #f4f3ee; color: #121212;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #loader.is-done { opacity: 0; visibility: hidden; }
    #loader .l-wrap { display: grid; justify-items: center; gap: 22px; }
    #loader .l-mark { position: relative; width: 84px; height: 84px; perspective: 400px; }
    #loader .l-square {
      position: absolute; inset: 0; border-radius: 22px;
      border: 2px solid #121212;
      animation: l-flip 1.6s cubic-bezier(.6, 0, .3, 1) infinite;
    }
    #loader .l-text { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
    #loader .l-bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(18,18,18,.08); overflow: hidden; }
    #loader .l-bar span {
      display: block; height: 100%; width: 40%; border-radius: inherit;
      background: linear-gradient(90deg, #6d5dfc, #e0559b, #ff9f43);
      animation: l-slide 1.1s ease-in-out infinite;
    }
    @keyframes l-flip { 0% { transform: rotateY(0) rotateX(0); } 50% { transform: rotateY(180deg) rotateX(0); } 100% { transform: rotateY(180deg) rotateX(180deg); } }
    @keyframes l-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #loader .l-square, #loader .l-bar span { animation: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://www.google.com/recaptcha/api.js?render=explicit&hl=fr" async defer></script>
</head>
<body>
  <div id="loader" role="status" aria-label="Chargement">
    <div class="l-wrap">
      <div class="l-mark"><div class="l-square"></div><div class="l-text">JM</div></div>
      <div class="l-bar"><span></span></div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
